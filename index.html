<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тестирование</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--ac:#3b6cf6;--ok:#1f9d55;--bad:#d64545;--bd:#dde2ee;--sel:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a1b8;--ac:#6c93ff;--ok:#3ec47c;--bad:#ef6b6b;--bd:#2c3347;--sel:#243256}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a1b8;--ac:#6c93ff;--ok:#3ec47c;--bad:#ef6b6b;--bd:#2c3347;--sel:#243256}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px}
.pg{min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sp,.mid{flex:1}.mid{display:flex;flex-direction:column;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:10px}
.card.sm{padding:8px 12px}
h1{font-size:20px;margin:0}.mu{color:var(--mu);font-size:14px}
.hd{display:flex;align-items:center;gap:10px}.ttl{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--ac)}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer;flex:none}
.rib{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 1px 8px;margin-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rib::-webkit-scrollbar{display:none}
.rib button{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer}
.rib .dn{background:var(--sel);border-color:var(--ac)}.rib .cur{outline:2px solid var(--ac)}
.rib .pill{width:auto;padding:0 14px;height:32px;border-radius:99px;white-space:nowrap}.rib .pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{display:inline-block;font-size:12px;color:var(--ac);background:var(--sel);padding:2px 9px;border-radius:99px;margin-bottom:8px}
.q{font-size:17px;font-weight:600;margin:0 0 12px}
pre{background:var(--bg);padding:8px 12px;border-radius:8px;overflow-x:auto;font-weight:400;font-size:15px}
.o{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.o.on{background:var(--sel);border-color:var(--ac)}.o b{min-width:20px;color:var(--ac)}
.mi{margin-bottom:10px}.as{display:block;margin:0 0 0 12px;background:var(--ac);color:#fff;padding:6px 11px;border-radius:8px;font-size:14px;width:fit-content;max-width:100%}
input[type=text],select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;margin-bottom:10px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.btn{padding:11px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.cb{width:28px;height:28px;border:2px solid var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ac);flex:none}.cb.on{border-color:var(--ac);background:var(--sel)}
.op{padding:22px 16px;text-align:center;font-size:18px;font-weight:600;border:2px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.op.on{border-color:var(--ac);background:var(--sel)}.op.dim{opacity:.45}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-bottom:14px}
.tm{position:absolute;right:0;top:42px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.2);min-width:140px}
.tm button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;color:var(--tx);font:inherit;border-radius:8px;cursor:pointer}.tm button.on{background:var(--sel);color:var(--ac)}
.big{font-size:44px;font-weight:700;margin:4px 0}
.rv{border-left:4px solid var(--bd);padding:8px 12px;margin:8px 0;border-radius:4px;background:var(--bg);font-size:15px}
.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}
.ok-t{color:var(--ok);font-weight:600}.no-t{color:var(--bad);font-weight:600}
.st{margin:3px 0 6px 6px;font-size:14px;color:var(--mu)}.ln{margin:3px 0}
.rib .g{background:var(--ok);border-color:var(--ok);color:#fff}.rib .r{background:var(--bad);border-color:var(--bad);color:#fff}
.lock{pointer-events:none;opacity:.85}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:50;padding:20px}
.dbx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:420px;width:100%}.dbx p{margin:0 0 16px}
.chk{display:flex;align-items:center;gap:10px;border:2px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer;max-width:270px;font-size:15px;line-height:1.3}
.bar2{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:4;background:var(--bg);margin:0 -12px;padding:10px 12px;border-top:1px solid var(--bd)}
.hb{height:36px;padding:0 12px;font-size:14px;white-space:nowrap}
</style></head><body><div class="w" id="app"></div><div class="ov" id="dlg" style="display:none"></div>
<script>
const L='абвгд';
const Q=[
{t:'o',q:'Найдите rank A.<pre>    | 1 2 0 3 |\nA = | 0 1 2 4 |\n    | 0 0 1 5 |</pre>',a:['3']},

{t:'c',q:'Какое из условий необходимо для существования единственного решения системы линейных уравнений?',o:['Ранг матрицы коэффициентов равен рангу расширенной матрицы и числу неизвестных','Ранг матрицы коэффициентов больше числа неизвестных.','Все коэффициенты системы положительные.','Число уравнений равно числу неизвестных.'],a:'а'},

{t:'c',q:'Что означает ранг матрицы?',o:['Максимальное число линейно независимых строк или столбцов','Количество строк','Количество всех элементов матрицы','Размерность пространства решений'],a:'а'},
{t:'c',q:'Линейное программирование — это:',o:['Раздел математики, изучающий решение уравнений высших степеней','Метод решения задач оптимизации, в которых целевая функция и ограничения являются линейными.','Раздел алгебры, занимающийся вычислением определителей и матриц.','Метод решения дифференциальных уравнений с линейными коэффициентами.'],a:'б'},
{t:'c',q:'Какое условие необходимо для существования обратной матрицы?',o:['Матрица должна быть прямоугольной','Определитель матрицы должен быть равен нулю','Матрица должна быть квадратной и иметь ненулевой определитель','Матрица должна содержать только положительные элементы'],a:'в'},

{t:'s',q:'Установите правильную последовательность этапов при анализе задач линейного программирования.',o:['Определить целевую функцию и ограничения.','Вычислить значения целевой функции в найденных точках','Найти точки, удовлетворяющие ограничениям.','Проверить, где достигается максимум или минимум.','Определить оптимальное решение.'],a:'авбгд'},

function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const okOpen=(q,v)=>{const u=norm(v);return !!u&&q.a.some(a=>{a=norm(a);return a===u||(a.length>=7&&lev(a,u)<=1)})};
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(q,sh,si){const c={...q,si,sn:SUBJ[si].name};if(!sh||q.t==='o')return c;
 const n=q.t==='m'?q.r.length:q.o.length,p=shuf([...Array(n).keys()]),mp=x=>L[p.indexOf(L.indexOf(x))];
 if(q.t==='c'){c.o=p.map(i=>q.o[i]);c.a=mp(q.a)}
 if(q.t==='m'){c.r=p.map(i=>q.r[i]);c.a=[...q.a].map(mp).join('')}
 if(q.t==='s'){c.o=p.map(i=>q.o[i]);c.a=[...q.a].map(mp).join('')}
 return c}
function build(){const subs=SUBJ.map((_,i)=>i).filter(i=>S.sel.includes(i));let it=[];
 if(S.mode==='accr'){SUBJ.forEach((s,i)=>s.Q.forEach(q=>it.push(prep(q,1,i))));it=shuf(it).slice(0,20)}
 else if(S.mode==='mix'){subs.forEach(i=>SUBJ[i].Q.forEach(q=>it.push(prep(q,1,i))));it=shuf(it)}
 else subs.forEach(i=>{const rd=S.mode==='rand';(rd?shuf(SUBJ[i].Q):SUBJ[i].Q).forEach(q=>it.push(prep(q,rd,i)))});
 S.items=it;S.A=it.map(q=>q.t==='s'?[]:q.t==='m'?Array(q.l.length).fill(''):'');S.cur=0;S.chk=[];S.hv=null;S.v='test';draw();scrollTo(0,0)}
const done=i=>{const v=S.A[i],q=S.items[i];return q.t==='m'?v.every(x=>x):q.t==='s'?v.length===q.a.length:!!String(v).trim()};
const ok=i=>{const v=S.A[i],q=S.items[i];if(q.t==='o')return okOpen(q,v);if(q.t==='c')return v===q.a;return v.join('')===q.a};
/* ---- start / options ---- */
const tog=i=>{const k=S.sel.indexOf(i);k>=0?S.sel.splice(k,1):S.sel.push(i);draw()};
const selAll=()=>{S.sel=S.sel.length===SUBJ.length?[]:SUBJ.map((_,i)=>i);draw()};
const menu=()=>{S.menu=!S.menu;draw()};
const toOpts=()=>{S.v='opts';S.mode='';draw()};
function vStart(){const all=S.sel.length===SUBJ.length;
 return `<div class="pg"><div class="top"><h1>Выбор предмета:</h1><div style="display:flex;gap:8px;align-items:center"><button class="btn hb" onclick="toHist()">История</button><div style="position:relative"><button class="x" onclick="menu()" aria-label="Тема">${dark()?'🌙':'☀️'}</button>${S.menu?`<div class="tm">${[['auto','Авто'],['light','Светлая'],['dark','Тёмная']].map(([k,n])=>`<button class="${TH===k?'on':''}" onclick="setTh('${k}')">${n}</button>`).join('')}</div>`:''}</div></div></div>
 <div style="text-align:right;margin:10px 0"><button class="btn" onclick="selAll()">${all?'Снять все':'Выбрать все'}</button></div>
 ${SUBJ.map((s,i)=>{const on=S.sel.includes(i);return `<div class="sr" onclick="tog(${i})"><span>${e(s.name)}</span><span class="cb ${on?'on':''}">${on?'✓':''}</span></div>`}).join('')}
 <div class="sp"></div><div class="bar2"><div class="nav" style="align-items:stretch;margin-top:0"><button class="btn" style="flex:1;border-color:var(--ac);color:var(--ac)" onclick="startAccr()">Аккредитация (20 вопросов)</button><button class="btn p" style="flex:1" onclick="toOpts()" ${S.sel.length?'':'disabled'}>Начать тестирование</button></div></div></div>`}
const startAccr=()=>{S.mode='accr';build()};
function vOpts(){const ms=S.sel.length>1?['mix','rand','file']:['rand','file'];
 return `<div class="pg"><div class="top" style="justify-content:flex-end"><div class="chk" onclick="S.imm=!S.imm;draw()"><span class="cb ${S.imm?'on':''}">${S.imm?'✓':''}</span><span>Показать сразу верность ответа</span></div></div><div class="mid">${ms.map(m=>`<div class="op ${S.mode===m?'on':''} ${S.mode&&S.mode!==m?'dim':''}" onclick="S.mode='${m}';draw()">${MN[m][0]}</div><div class="hint">${MN[m][1]}</div>`).join('')}</div>
 <div class="nav"><button class="btn" onclick="S.v='start';draw()">← Назад</button><button class="btn p" onclick="build()" ${S.mode?'':'disabled'}>Начать тестирование</button></div></div>`}
/* ---- test ---- */
function body(i){const q=S.items[i],v=S.A[i];let h=`<span class="tag">${T[q.t]}</span><p class="q">${q.q}</p>`;
 if(q.t==='o')h+=`<input type="text" id="oi" placeholder="Введите ответ" value="${e(v)}" oninput="S.A[${i}]=this.value;chip()" onkeydown="if(event.key==='Enter'){event.preventDefault();adv()}" enterkeyhint="${i<S.items.length-1?'next':'done'}" ${S.chk[i]?'readonly':''} autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">`;
 if(q.t==='c')h+=q.o.map((t,k)=>`<div class="o ${v===L[k]?'on':''}" onclick="S.A[${i}]='${L[k]}';draw()"><b>${L[k]})</b><span>${e(t)}</span></div>`).join('');
 if(q.t==='m'){const J=q.r.map((_,k)=>k);
  h+=`<div class="mu" style="margin-bottom:8px">Варианты:</div>`+J.map(j=>`<div class="mi"><div class="o" style="cursor:default;margin-bottom:6px"><b>${L[j]}.</b><span>${e(q.r[j])}</span></div>${v.map((x,k)=>x===L[j]?`<span class="as">${k+1}. ${e(q.l[k])}</span>`:'').join('')}</div>`).join('')
  +`<div class="mu" style="margin:12px 0 8px">Сопоставьте:</div>`+q.l.map((t,k)=>`<div class="row"><span>${k+1}. ${e(t)}</span><select onchange="S.A[${i}][${k}]=this.value;draw()"><option value="">—</option>${J.map(j=>`<option value="${L[j]}" ${v[k]===L[j]?'selected':''} ${v.some((x,m)=>m!==k&&x===L[j])?'disabled':''}>${L[j]}</option>`).join('')}</select></div>`).join('')}
 if(q.t==='s')h+=`<div class="mu" style="margin-bottom:8px">Нажимайте на шаги по порядку. Повторное нажатие снимает выбор.</div>`+q.o.map((t,k)=>{const p=v.indexOf(L[k]);return `<div class="o ${p>=0?'on':''}" onclick="seq(${i},'${L[k]}')">${p>=0?`<span class="n">${p+1}</span>`:`<span class="n" style="background:var(--bd);color:var(--mu)">·</span>`}<span>${e(t)}</span></div>`}).join('');
 return h}
function chip(){const b=document.querySelectorAll('#rib button')[S.cur];b&&b.classList.toggle('dn',done(S.cur))}
function seq(i,l){const v=S.A[i],p=v.indexOf(l);p>=0?v.splice(p,1):v.push(l);draw()}
function go(i){S.cur=i;draw();scrollTo(0,0)}
function ask(msg,yes,yl,nl){const d=document.getElementById('dlg');d.innerHTML=`<div class="dbx"><p>${msg}</p><div class="nav" style="justify-content:flex-end"><button class="btn" id="dn">${nl||'Отмена'}</button><button class="btn p" id="dy">${yl||'Да'}</button></div></div>`;d.style.display='flex';
 document.getElementById('dn').onclick=()=>{d.style.display='none'};document.getElementById('dy').onclick=()=>{d.style.display='none';yes()}}
const proceed=()=>S.cur<S.items.length-1?go(S.cur+1):fin();
function adv(){const i=S.cur;if(S.imm&&S.mode!=='accr'&&!S.chk[i]&&done(i)){S.chk[i]=ok(i)?'ok':'no';if(S.chk[i]==='no'){draw();return}}proceed()}
function exitT(){ask('Выйти из теста? Ответы не сохранятся.',()=>{S.v='start';draw();scrollTo(0,0)},'Выйти')}
const mpairs=(q,a)=>q.r.map((_,j)=>`${L[j]} - ${a.indexOf(L[j])>=0?a.indexOf(L[j])+1:'?'}`).join(', ');
const mlines=(q,a,ref)=>q.r.map((t,j)=>{const u=a.indexOf(L[j]);return `<div class="ln">${L[j]}. ${e(t)} — ${u>=0?`${u+1}. ${e(q.l[u])}`:'нет ответа'}${ref?` — ${u===ref.indexOf(L[j])?'<span class="ok-t">Верно</span>':'<span class="no-t">Неверно</span>'}`:''}</div>`}).join('');
const sfmt=(q,a)=>`<div class="st">${a.map((l,p)=>`${p+1}) ${l}. ${e(q.o[L.indexOf(l)])}`).join('<br>')}</div>`;
function corr(q){if(q.t==='o')return `Правильный ответ: <b>${e(q.a[0])}</b>`;
 if(q.t==='c')return `Правильный ответ: <b>${q.a}) ${e(q.o[L.indexOf(q.a)])}</b>`;
 if(q.t==='m'){const a=[...q.a];return `Правильный ответ: <b>${mpairs(q,a)}</b>${mlines(q,a)}`}
 return `Правильный ответ: <b>${[...q.a].join(', ')}</b>${sfmt(q,[...q.a])}`}
const ansP=i=>`<div class="rv no" style="margin-top:12px"><span class="no-t">Неверно.</span><br>${corr(S.items[i])}</div>`;
function vTest(){const it=S.items,q=it[S.cur],n=it.length,multi=S.sel.length>1&&S.mode!=='mix'&&S.mode!=='accr';
 const title=S.mode==='accr'?'Аккредитация':S.mode==='mix'?'Смешанный тест':SUBJ[q.si].name;
 const subs=multi?`<div class="rib" id="subs">${[...new Set(it.map(x=>x.si))].map(si=>`<button class="pill ${si===q.si?'on':''}" onclick="go(${it.findIndex(x=>x.si===si)})">${e(SUBJ[si].name)}</button>`).join('')}</div>`:'';
 return `<div class="card sm"><div class="hd"><button class="x" onclick="exitT()" aria-label="Выйти">✕</button><b class="ttl">${e(title)}</b><span class="mu">${S.cur+1} / ${n}</span></div><div class="bar"><i style="width:${(S.cur+1)/n*100}%"></i></div></div>${subs}
 <div class="rib" id="rib">${it.map((_,i)=>`<button class="${S.chk[i]==='ok'?'g':S.chk[i]==='no'?'r':done(i)?'dn':''} ${i===S.cur?'cur':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div>
 <div class="card"><div class="${S.chk[S.cur]?'lock':''}">${body(S.cur)}</div>${S.chk[S.cur]==='no'?ansP(S.cur):''}</div>
 <div class="nav"><button class="btn" onclick="go(S.cur-1)" ${S.cur?'':'disabled'}>← Назад</button>${S.cur<n-1?`<button class="btn p" onclick="adv()">Далее →</button>`:`<button class="btn p" onclick="adv()">Завершить тест</button>`}</div>`}
/* ---- result ---- */
function fin(){const un=S.items.filter((_,i)=>!done(i)).length,g2=()=>{S.hv=null;hAdd();S.v='res';draw();scrollTo(0,0)};un?ask(`Без ответа осталось вопросов: ${un}. Завершить тест?`,g2,'Завершить','Продолжить'):g2()}
function rv(i){const q=S.items[i],v=S.A[i],r=ok(i),V=r?'<span class="ok-t">Верно</span>':'<span class="no-t">Неверно</span>',pl=q.q.replace(/<pre>[\s\S]*?<\/pre>/,'');
 let h=`<div class="rv ${r?'ok':'no'}"><b>${i+1}.</b> ${pl}<br>`;
 if(q.t==='o')h+=`Ваш ответ: ${e(v||'—')} — ${V}`+(r?'':`<br>Правильно: <b>${e(q.a[0])}</b>`);
 if(q.t==='c'){const f=l=>l?`${l}) ${e(q.o[L.indexOf(l)])}`:'—';h+=`Ваш ответ: ${f(v)} — ${V}`+(r?'':`<br>Правильно: <b>${f(q.a)}</b>`)}
 if(q.t==='m'){const ca=[...q.a];h+=`Ваш ответ: ${mpairs(q,v)} — ${V}${mlines(q,v,ca)}`+(r?'':`<br>Верно: ${mpairs(q,ca)}${mlines(q,ca,ca)}`)}
 if(q.t==='s')h+=`Ваш ответ: ${v.length?v.join(', '):'—'} — ${V}.`+(v.length?sfmt(q,v):'')+(r?'':`<br>Верно: ${[...q.a].join(', ')}.${sfmt(q,[...q.a])}`);
 return h+'</div>'}
function vRes(){const it=S.items,N=it.length,s=it.filter((_,i)=>ok(i)).length,p=Math.round(s/N*100),g=p>=85?'Продвинутый уровень':p>=70?'Повышенный уровень':p>=50?'Базовый уровень':'Компетенции не сформированы';
 const cnt=f=>{const ix=it.map((q,i)=>f(q)?i:-1).filter(i=>i>=0);return ix.length?`${ix.filter(ok).length} из ${ix.length}`:''};
 let by=['o','c','m','s'].map(t=>cnt(q=>q.t===t)?`<div class="mu">${T[t]}: ${cnt(q=>q.t===t)}</div>`:'').join('');
 if(new Set(it.map(x=>x.si)).size>1)by+='<div style="height:6px"></div>'+[...new Set(it.map(x=>x.si))].map(si=>`<div class="mu">${e(it.find(x=>x.si===si).sn)}: ${cnt(q=>q.si===si)}</div>`).join('');
 return `<div class="card" style="text-align:center"><h1>Результат</h1>${S.hv?`<div class="mu">${e(S.hv.title)} · ${fmtD(S.hv.id)}</div>`:''}<div class="big">${s} / ${N}</div><div>${p}% · ${g}</div><div style="margin-top:8px">${by}</div><div class="nav" style="justify-content:center;flex-wrap:wrap;margin-top:14px">${S.hv?`<button class="btn" onclick="toHist()">← К истории</button>`:''}<button class="btn" onclick="S.v='start';S.hv=null;draw()">На главную</button>${!S.hv||S.hv.mode==='accr'||S.hv.sel.some(i=>i<SUBJ.length)?`<button class="btn p" onclick="rerun()">Пройти заново</button>`:''}</div></div>
 <div class="card"><h1 style="margin-bottom:6px">Разбор ответов</h1>${it.map((_,i)=>rv(i)).join('')}</div>`}
/* ---- history ---- */
let HM=[];
function hLoad(){try{HM=JSON.parse(localStorage.getItem('lh')||'[]')}catch(x){}if(!Array.isArray(HM))HM=[];return HM}
function hPut(h){HM=h;const c=h.slice();for(;;){try{localStorage.setItem('lh',JSON.stringify(c));return}catch(x){if(c.length<=1)return;c.pop()}}}
function hAdd(){const N=S.items.length,s=S.items.filter((_,i)=>ok(i)).length,
  title=S.mode==='accr'?'Аккредитация':S.mode==='mix'?'Смешанный тест':[...new Set(S.items.map(x=>x.si))].map(si=>S.items.find(x=>x.si===si).sn).join(', ');
  const h=hLoad().slice();h.unshift({id:Date.now(),mode:S.mode,sel:S.sel.slice(),title,s,N,p:N?Math.round(s/N*100):0,items:S.items,A:S.A});hPut(h.slice(0,50))}
const fmtD=t=>{const d=new Date(t),z=n=>String(n).padStart(2,'0');return `${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`};
const ML={accr:'Аккредитация',mix:'Смешанный',rand:'Вразброс',file:'Как в файле'};
const toHist=()=>{S.v='hist';S.hv=null;draw();scrollTo(0,0)};
function openH(id){const r=hLoad().find(x=>x.id===id);if(!r)return;S.hv=r;S.items=r.items;S.A=r.A;S.v='res';draw();scrollTo(0,0)}
function rerun(){const r=S.hv;if(r){S.mode=r.mode;S.sel=r.sel.filter(i=>i<SUBJ.length)}build()}
const clrH=()=>ask('Удалить всю историю результатов?',()=>{hPut([]);draw()},'Удалить');
function vHist(){const h=hLoad();
  return `<div class="pg"><div class="top"><h1>История</h1><button class="btn hb" onclick="S.v='start';draw()">← Назад</button></div>
  <div style="margin-top:12px">${h.length?h.map(r=>`<div class="sr" onclick="openH(${r.id})"><div style="min-width:0"><div style="font-weight:600">${e(r.title)}</div><div class="mu">${fmtD(r.id)} · ${ML[r.mode]||''}</div></div><div style="text-align:right;flex:none"><b>${r.s} / ${r.N}</b><div class="mu ${r.p>=50?'ok-t':'no-t'}">${r.p}%</div></div></div>`).join(''):`<div class="mu" style="text-align:center;margin:40px 0">Пока нет пройденных тестов</div>`}</div>
  <div class="sp"></div>${h.length?`<button class="btn" onclick="clrH()">Очистить историю</button>`:''}</div>`}
function draw(){const so=document.getElementById('subs'),sl=so?so.scrollLeft:null;app.innerHTML=S.v==='start'?vStart():S.v==='opts'?vOpts():S.v==='test'?vTest():S.v==='hist'?vHist():vRes();
 if(S.v==='test'){const r=document.getElementById('rib'),c=r.querySelector('.cur');if(c)r.scrollLeft=c.offsetLeft-r.clientWidth/2+c.offsetWidth/2;const sb=document.getElementById('subs');if(sb){if(sl!==null)sb.scrollLeft=sl;const p=sb.querySelector('.on');if(p){const l=p.offsetLeft,rg=l+p.offsetWidth;if(l<sb.scrollLeft||rg>sb.scrollLeft+sb.clientWidth)sb.scrollLeft=l-sb.clientWidth/2+p.offsetWidth/2}}
 const x=document.getElementById('oi');if(x)x.focus()}}
draw();
</script></body></html>
